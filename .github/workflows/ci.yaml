name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy:
      runs-on: ubuntu-latest
      environment: production

      steps:
        - name: Deploy to production
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{ vars.SSH_HOST }}
            port: ${{ vars.SSH_PORT }}
            username: ${{ vars.SSH_USER }}
            key: ${{ secrets.SSH_KEY }}
            script_stop: true
            script: |
              cd ${{ vars.PROJECT_DIR }}
              git stash
              git checkout main
              git pull origin main
              docker build -t initiative-front .
              docker create --name initiative-front initiative-front nop
              docker cp initiative-front:/dist/* ${{ vars.DIST_DIR }}
              docker container rm initiative-front
